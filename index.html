<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Internship Task Portal</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="app-header">
    <h1>Internship Task Portal</h1>
    <p>View your assigned tasks and update their status.</p>
  </header>

  <main class="container">

    <!-- Summary: total / pending / in progress / completed -->
    <section class="summary" id="summary" aria-label="Task summary"></section>

    <!-- Filters -->
    <section class="card filters" aria-label="Filters">
      <div class="field">
        <label for="filterStatus">Status</label>
        <select id="filterStatus">
          <option value="all">All</option>
          <option value="Pending">Pending</option>
          <option value="In Progress">In Progress</option>
          <option value="Completed">Completed</option>
        </select>
      </div>

      <div class="field">
        <label for="filterPriority">Priority</label>
        <select id="filterPriority">
          <option value="all">All</option>
          <option value="High">High</option>
          <option value="Medium">Medium</option>
          <option value="Low">Low</option>
        </select>
      </div>

      <button type="button" id="clearFilters" class="btn btn-secondary">Clear Filters</button>
    </section>

    <!-- Add Task Form -->
    <section class="card" aria-label="Add new task">
      <h2>Add New Task</h2>
      <form id="taskForm" novalidate>
        <div class="field">
          <label for="title">Title *</label>
          <input type="text" id="title" placeholder="e.g. Complete README">
          <span class="error" id="titleError"></span>
        </div>

        <div class="field">
          <label for="description">Description *</label>
          <textarea id="description" rows="3" placeholder="Short details about the task"></textarea>
          <span class="error" id="descriptionError"></span>
        </div>

        <div class="form-row">
          <div class="field">
            <label for="priority">Priority *</label>
            <select id="priority">
              <option value="">Select priority</option>
              <option value="High">High</option>
              <option value="Medium">Medium</option>
              <option value="Low">Low</option>
            </select>
            <span class="error" id="priorityError"></span>
          </div>

          <div class="field">
            <label for="deadline">Deadline *</label>
            <input type="date" id="deadline">
            <span class="error" id="deadlineError"></span>
          </div>
        </div>

        <button type="submit" class="btn btn-primary">Add Task</button>
      </form>
    </section>

    <!-- Task List (JavaScript yahan cards add karega) -->
    <section aria-label="Task list">
      <h2>My Tasks</h2>
      <div id="taskList" class="task-list"></div>
      <p id="emptyMessage" class="empty" hidden>No tasks found.</p>
    </section>

  </main>

  <footer class="app-footer">
    <p>Internship Task Portal</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
